trigger:
  - main

resources:
  - repo: self

variables:
  tag: '$(Build.BuildId)'
  dockerRegistryServiceConnection: "oberon360RegistryContainer"
  containerRegistry: "oberonregistry.azurecr.io"
  imageRepository: "wha-bot"
  azureServiceConnection: "AZ-suscription-DESARROLLO"
  resourceGroupName: "DESARROLLO"
  containerAppName: "wha-bot"

stages:
  # ==========================================
  # STAGE 1: CALIDAD DE CÓDIGO (QA)
  # ==========================================
  - stage: QualityGate
    displayName: "🔍 Quality Gate"
    jobs:
      - job: BuildCheck
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '24.x'
            displayName: 'Install Node.js'

          - script: |
              npm ci
            displayName: 'Install Dependencies'

          - script: |
              npm run build
            displayName: 'Build TypeScript'

  # ==========================================
  # STAGE 2: CONSTRUCCIÓN Y SUBIDA (ACR)
  # ==========================================
  - stage: BuildAndPush
    displayName: "📦 Build & Push"
    dependsOn: QualityGate
    condition: succeeded()
    jobs:
      - job: Build
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - script: |
              curl -s -X POST "$(WHA_URL)" \
                -H "Content-Type: application/json" \
                -d "{\"to\":[\"$(WHA_GROUP)\"],\"message\":\"🚀 *[Wha-Bot]* Calidad validada. Iniciando Build...\"}" || true
            displayName: "🔔 WhatsApp - Inicio"

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - script: |
              docker buildx create --use
              docker buildx build \
                --platform linux/amd64 \
                --provenance=false \
                -f dockerfile \
                -t $(containerRegistry)/$(imageRepository):$(tag) \
                -t $(containerRegistry)/$(imageRepository):latest \
                --push .
            displayName: "Build and Push Image"

  # ==========================================
  # STAGE 3: DESPLIEGUE (AZURE CONTAINER APPS)
  # ==========================================
  - stage: Deploy
    displayName: "🚀 Deploy to ACA"
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: ACADeploy
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: AzureCLI@2
            displayName: "Actualizar Imagen en ACA"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az containerapp update \
                  --name $(containerAppName) \
                  --resource-group $(resourceGroupName) \
                  --image $(containerRegistry)/$(imageRepository):$(tag)

          - script: |
              curl -s -X POST "$(WHA_URL)" \
                -H "Content-Type: application/json" \
                -d "{\"to\":[\"$(WHA_GROUP)\"],\"message\":\"✅ *[Wha-Bot]* Despliegue EXITOSO\n🌐 App: *$(containerAppName)*\n🔢 Tag: *$(tag)*\"}" || true
            displayName: "🔔 WhatsApp - Éxito"
            condition: succeeded()

          - script: |
              curl -s -X POST "$(WHA_URL)" \
                -H "Content-Type: application/json" \
                -d "{\"to\":[\"$(WHA_GROUP)\"],\"message\":\"❌ *[Wha-Bot]* FALLO EN EL DESPLIEGUE\"}" || true
            displayName: "🔔 WhatsApp - Fallo"
            condition: failed()
